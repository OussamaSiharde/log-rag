services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lograg
      POSTGRES_PASSWORD: lograg
      POSTGRES_DB: lograg
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lograg -d lograg"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.12.6
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
