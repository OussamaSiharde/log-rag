[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lograg"
version = "0.1.0"
description = "Local retrieval-augmented Q&A over infrastructure logs: Ollama + PostgreSQL/pgvector, fully offline."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Oussama Siharde" }]
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lograg = "lograg.cli:main"

[tool.setuptools]
packages = ["lograg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test the source tree, not whatever copy happens to be installed in the venv.
pythonpath = ["."]
